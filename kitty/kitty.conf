include ./theme.conf
allow_remote_control yes
listen_on unix:/tmp/kitty

# Tabs at the top (Warp-like)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{bell_symbol}{title}"

# Keep agent CLIs silent but allow bells to badge the tab.
enable_audio_bell no
bell_on_tab "! "
tab_activity_symbol none
window_alert_on_bell yes
macos_dock_badge_on_bell yes

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #3b4252
inactive_tab_foreground #a0a0a0
inactive_tab_background #2e3440

# NOTE: Kitty 0.45.0 has no tab_bar_font_size / tab_bar_margin_height / tab_bar_margin_width
# If you want a bigger tab bar, increase font_size slightly (e.g. 14.5 or 15.0)

font_family JetBrains Mono
font_size 14.5
modify_font cell_height 108%

# Static gradient instead of real translucency, so the look doesn't depend on the window behind
background_image ~/.config/kitty/bg.png
background_image_layout scaled
hide_window_decorations titlebar-only

# Padding (Warp-like breathing room)
window_padding_width 10
window_margin_width 4

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Selection / copy
copy_on_select clipboard
mouse_hide_wait 3.0

# Scrollback
scrollback_lines 10000
scrollback_pager less
